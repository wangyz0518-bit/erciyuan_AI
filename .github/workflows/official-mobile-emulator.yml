name: Official Flutter Android emulator UI

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/official-mobile-emulator.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/official-mobile-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui:
    name: Android emulator UI, screenshots and integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Install official Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline demo gateway
        run: |
          python -m pip install -r services/person_gateway/requirements.txt
      - name: Run real Android emulator and official UI checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/mobile
          script: bash tool/run_official_ui_preview_ci.sh
      - name: Save emulator logcat
        if: always()
        run: timeout --signal=TERM --kill-after=3s 20s adb logcat -d -t 2500 -v time > android-official-ui-logcat.txt || true
      - name: Upload actual emulator UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erciyuan-official-android-emulator-ui
          path: artifacts/official-android-emulator-ui/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erciyuan-official-android-emulator-logcat
          path: |
            android-official-ui-logcat.txt
            artifacts/official-android-emulator-ui/device-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
