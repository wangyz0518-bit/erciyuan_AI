name: Flutter official mobile validation

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "services/person_gateway/**"
      - "docs/接口/person-text-gateway-v1-20261118.md"
      - ".github/workflows/flutter-mobile.yml"
      - ".github/workflows/person-gateway.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "services/person_gateway/**"
      - "docs/接口/person-text-gateway-v1-20261118.md"
      - ".github/workflows/flutter-mobile.yml"
      - ".github/workflows/person-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  person-gateway:
    name: Python gateway offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/person_gateway/requirements.txt
      - name: Install gateway test dependencies
        working-directory: services/person_gateway
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        working-directory: services/person_gateway
        run: python -m compileall -q gateway.py tests
      - name: Run offline tests only
        working-directory: services/person_gateway
        env:
          PERSON_GATEWAY_MODE: mock
          PERSON_LIVE_CALLS_ENABLED: "false"
          DEEPSEEK_API_KEY: ""
        run: python -m pytest -q

  verify:
    name: Analyze, test, build Android debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Check Dart formatting
        working-directory: apps/mobile
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test test_screenshots; then
            dart format lib test test_screenshots
            git --no-pager diff -- lib test test_screenshots
            exit 1
          fi
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Build Android debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: erciyuan-mobile-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Render Flutter UI previews (375px)
        working-directory: apps/mobile
        run: timeout --signal=TERM 150s flutter test --update-goldens --reporter expanded test_screenshots/official_ui_preview_test.dart
      - name: Upload Flutter UI preview images
        uses: actions/upload-artifact@v4
        with:
          name: erciyuan-mobile-ui-preview-375px
          path: apps/mobile/test_screenshots/goldens/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Unit and Widget tests
        working-directory: apps/mobile
        run: timeout --signal=TERM 180s flutter test --reporter expanded --timeout 2m
