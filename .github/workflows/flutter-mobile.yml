name: Flutter official mobile validation

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test, build Android debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Capture resolved dependency lock for review
        working-directory: apps/mobile
        run: |
          echo LOCK_BEGIN
          base64 -w0 pubspec.lock
          echo
          echo LOCK_END
      - name: Format
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Unit and Widget tests
        working-directory: apps/mobile
        run: flutter test
      - name: Build Android debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: erciyuan-mobile-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
