name: Temporary formatter for issue 47

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/issue47-dart-format.yml"

permissions:
  contents: write

jobs:
  format-author-branch:
    if: github.event.pull_request.user.login == 'keeyangyy' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/issue47-offline-person-memory-20261118'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
      - name: Apply Dart formatter
        working-directory: apps/mobile
        run: dart format lib test
      - name: Commit formatted files to this issue branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib apps/mobile/test
          if ! git diff --cached --quiet; then
            git commit -m "style(memory): apply dart format to issue 47 source"
            git push origin HEAD:refs/heads/feat/issue47-offline-person-memory-20261118
          fi
