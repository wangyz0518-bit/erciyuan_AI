name: Flutter Android validation

on:
  pull_request:
    paths:
      - "apps/mobile_poc/**"
      - ".github/workflows/flutter-android.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile_poc/**"
      - ".github/workflows/flutter-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install dependencies
        working-directory: apps/mobile_poc
        run: flutter pub get

      - name: Check formatting
        working-directory: apps/mobile_poc
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: apps/mobile_poc
        run: flutter analyze

      - name: Unit and widget tests
        working-directory: apps/mobile_poc
        run: flutter test

      - name: Build Android debug APK
        working-directory: apps/mobile_poc
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/mobile_poc/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Android emulator integration tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile_poc
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android emulator integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/mobile_poc
          # Runner executes script as one command, preserving Bash cwd and EXIT trap.
          script: bash tool/run_android_integration_ci.sh

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logcat
          path: android-emulator-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
