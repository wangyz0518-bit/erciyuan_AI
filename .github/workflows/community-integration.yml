name: Community search and moderation

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "services/model_gateway/**"
      - "packages/live2d_avatar/**"
      - ".github/workflows/community-integration.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "services/model_gateway/**"
      - "packages/live2d_avatar/**"
      - ".github/workflows/community-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  community:
    name: Android app and operator browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Install gateway and browser test dependencies
        working-directory: services/model_gateway
        run: |
          python -m pip install -r requirements.txt playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Test the model gateway
        working-directory: services/model_gateway
        run: python -m pytest -q tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Search, import, chat, report and review on the same gateway
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          working-directory: services/model_gateway
          script: python -m pytest -q -s tests/android_community_e2e.py
