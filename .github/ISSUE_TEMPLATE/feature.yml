name: 需求
description: 提出产品需求或功能改进
title: "[需求] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前先搜索现有 Issue 和调研文档，避免重复。
        需求先说明要解决的问题，再谈方案；具体实现拆解请用任务模板。

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 用户场景是什么？现在哪里不方便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望它怎么工作？可以不写具体实现。
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 第一阶段必须
        - 后续阶段
        - 待讨论
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - A 手机界面与交互
        - B 角色与对话核心
        - C 形象制作与驱动
        - D 声音处理
        - 服务端 / 接口
        - 文档 / 工具
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 其他补充
      description: 考虑过哪些替代方案？有没有参考产品？
    validations:
      required: false