name: 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前先搜索现有 Issue 和调研文档，避免重复。
        功能建议先说明要解决的问题，再谈方案。

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 你正在做什么？现在哪里不方便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望它怎么工作？可以不写具体实现。
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - A 手机界面与交互
        - B 角色与对话核心
        - C 形象制作与驱动
        - D 声音处理
        - 服务端 / 接口
        - 文档 / 工具
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 其他补充
      description: 考虑过哪些替代方案？有没有参考产品？
    validations:
      required: false