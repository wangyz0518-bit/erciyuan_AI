name: 任务
description: 记录一项可验收的协作任务
title: "[任务] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        提交前先搜索现有 Issue，避免重复。
        任务应能独立验收；存在依赖时请写明。成员可在讨论中共同认领和推进，无需预先指定负责人。

  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: 这项工作解决什么问题？
      placeholder: 用一两句话说明背景和目标。
    validations:
      required: true

  - type: input
    id: participants
    attributes:
      label: 参与者（可选）
      description: 可填写已确定的参与者；尚未确定时留空。
      placeholder: 例如：@xxx、@yyy
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: 依赖
      description: 依赖哪些接口、其他任务或外部条件？没有可留空。
    validations:
      required: false

  - type: textarea
    id: deliverables
    attributes:
      label: 交付内容
      description: 完成后会产出什么？
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 可检查、可演示的结果；区分真实能力与模拟结果。
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 备注
      description: 其他上下文、参考链接、风险。
    validations:
      required: false
