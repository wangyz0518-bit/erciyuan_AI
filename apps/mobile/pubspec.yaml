publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  sqflite: ^2.4.6
  sqflite_common: ^2.5.17
  path: ^1.9.1
  crypto: ^3.0.6
  record: ^7.2.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  file_picker: ^13.3.3
  live2d_avatar:
    path: ../../packages/live2d_avatar
  sqflite_common_ffi_web: ^1.2.2
  http: ^1.6.0
  web: ^1.1.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.6

flutter:
  uses-material-design: true
