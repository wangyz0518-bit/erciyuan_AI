<!DOCTYPE html>
<html lang="zh-CN"><head><base href="$FLUTTER_BASE_HREF"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>星伴 · 真实语音体验</title><style>
*{box-sizing:border-box}body{margin:0;background:#161b2a;color:#f3e9ff;font:16px/1.6 system-ui,sans-serif}main{width:min(32rem,90%);margin:16vh auto}h1{font-size:2rem}a{display:inline-block;padding:.6rem 1.1rem;background:#d8c5ff;color:#282137;text-decoration:none;border-radius:1.3rem}small{display:block;margin-top:1rem;color:#b8bdd2}
</style></head><body><main id="welcome"><h1>星伴</h1><p id="state">与小星对话，听她用已绑定的声音回答。</p>
<a id="link" href="http://127.0.0.1:18791/start">连接本机，进入聊天</a><small>请在运行网关的电脑上打开。首次连接时，请允许浏览器访问本地网络。</small></main>
<script>
addEventListener('flutter-first-frame', () => document.getElementById('welcome')?.remove(), {once:true});
addEventListener('hashchange', () => {
  if (new URLSearchParams(location.hash.slice(1)).has('grant')) location.reload();
});
(async () => {
  const base='http://127.0.0.1:18791', fragment=new URLSearchParams(location.hash.slice(1));
  const grant=fragment.get('grant');
  if(grant) history.replaceState(null,'',location.pathname+location.search);
  try {
    let token=sessionStorage.getItem('companion.session');
    if(grant){
      const response=await fetch(base+'/preview/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grant}),cache:'no-store'});
      if(!response.ok) throw new Error('pair');
      token=(await response.json()).token;
      sessionStorage.setItem('companion.session',token);
    }
    if(!token) return;
    const ready=await fetch(base+'/preview/ready',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(!ready.ok) throw new Error('expired');
    globalThis.companionSession=token;
    document.getElementById('link').hidden=true;
    document.getElementById('state').textContent='正在打开人物主页…';
    const app=document.createElement('script');app.src='flutter_bootstrap.js';app.onerror=()=>{document.getElementById('state').textContent='界面下载失败，请刷新重试。'};document.body.append(app);
  } catch (_) {
    sessionStorage.removeItem('companion.session');
    document.getElementById('state').textContent='尚未连上本机网关。请检查网关和浏览器的本地网络权限，然后重新连接。';
  }
})();
</script></body></html>
